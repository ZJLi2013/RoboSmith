<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="720" viewBox="0 0 1310 720" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<defs><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.10"/></filter><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1310" height="720" rx="18" fill="#ffffff"/>
<text x="40" y="48" font-size="23" font-weight="700" fill="#111827">RoboSmith: from one sentence to verified episodes</text>
<text x="40" y="72" font-size="13.5" fill="#6b7280">Agents write scenes and repair grasps; the simulator judges every asset, step and task with the same predicates. Genesis + Franka on AMD ROCm.</text>
<rect x="30" y="92" width="1250" height="250" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="54" y="122" font-size="15" font-weight="700" fill="#0f766e">① Agentic assets &amp; scenes</text>
<rect x="30" y="372" width="1250" height="282" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="54" y="402" font-size="15" font-weight="700" fill="#c2410c">② Agentic manipulation</text>
<path d="M290,184 L380,184" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>
<path d="M610,184 L700,184" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/><text x="655" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">asset missing</text>
<path d="M930,184 L1020,184" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/><text x="975" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">build</text>
<path d="M1135,145 C1135,118 815,118 815,145" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="975" y="117" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c3aed">rejected → revise</text>
<path d="M1135,223 L1135,295 L930,295" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>
<text x="1145" y="278" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f766e">admitted</text>
<path d="M700,295 L495,295 L495,223" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>
<text x="597" y="287" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">catalog lookup</text>
<path d="M420,223 L420,357 L235,357 L235,431" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#hand)"/>
<text x="412" y="312" text-anchor="end" font-size="12.5" font-weight="600" fill="#334155">scenario + teacher plan</text>
<path d="M290,470 L380,470" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/><text x="335" y="460" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2410c">layout</text>
<path d="M610,470 L700,470" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/><text x="655" y="460" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2410c">execute</text>
<path d="M930,470 L1020,470" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/><text x="975" y="460" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2410c">last step</text>
<path d="M815,431 C815,406 495,406 495,431" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<text x="655" y="405" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">next step</text>
<path d="M815,509 L815,556" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#loop)"/>
<text x="825" y="537" text-anchor="start" font-size="12.5" font-weight="600" fill="#7c3aed">pick: all candidates fail</text>
<path d="M700,595 L495,595 L495,509" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="597" y="587" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c3aed">retry with fix</text>
<path d="M1135,509 L1135,560" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#out)"/>
<text x="1145" y="537" text-anchor="start" font-size="12.5" font-weight="600" fill="#16a34a">success</text>
<rect x="60" y="145" width="230" height="78" rx="39" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" filter="url(#shadow)"/><text x="175" y="177" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">One-sentence request</text><text x="175" y="197" text-anchor="middle" font-size="12" fill="#6b7280">from a human</text>
<rect x="380" y="145" width="230" height="78" rx="12" fill="#fff" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/><text x="495" y="171" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Agent writes the scenario</text><text x="495" y="191" text-anchor="middle" font-size="12" fill="#6b7280">objects + relations · success tree</text><text x="495" y="207" text-anchor="middle" font-size="12" fill="#6b7280">· teacher plan</text><rect x="560.0" y="136" width="42.0" height="18" rx="9" fill="#fff" stroke="#0d9488" stroke-width="1"/><text x="581.0" y="149" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488" letter-spacing=".4">AGENT</text>
<rect x="700" y="145" width="230" height="78" rx="12" fill="#fff" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/><text x="815" y="171" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Agent builds the asset</text><text x="815" y="191" text-anchor="middle" font-size="12" fill="#6b7280">Blender script · image-to-3D</text><text x="815" y="207" text-anchor="middle" font-size="12" fill="#6b7280">· reconstructed room</text><rect x="880.0" y="136" width="42.0" height="18" rx="9" fill="#fff" stroke="#0d9488" stroke-width="1"/><text x="901.0" y="149" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488" letter-spacing=".4">AGENT</text>
<rect x="1020" y="145" width="230" height="78" rx="12" fill="#fff" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/><text x="1135" y="171" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Admission gate</text><text x="1135" y="191" text-anchor="middle" font-size="12" fill="#6b7280">LLM review with its own sim probes</text><text x="1135" y="207" text-anchor="middle" font-size="12" fill="#6b7280">· license · duplicates</text><rect x="1173.6" y="136" width="68.4" height="18" rx="9" fill="#fff" stroke="#0d9488" stroke-width="1"/><text x="1207.8" y="149" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488" letter-spacing=".4">LLM · SIM</text>
<rect x="700" y="268" width="230" height="54" rx="27" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/><text x="815" y="292" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Asset library</text><text x="815" y="312" text-anchor="middle" font-size="12" fill="#6b7280">searchable · on Hugging Face by hash</text>
<rect x="60" y="431" width="230" height="78" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/><text x="175" y="457" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Solve the layout</text><text x="175" y="477" text-anchor="middle" font-size="12" fill="#6b7280">relations per seed · objects must</text><text x="175" y="493" text-anchor="middle" font-size="12" fill="#6b7280">come to rest</text><rect x="253.2" y="422" width="28.799999999999997" height="18" rx="9" fill="#fff" stroke="#ea580c" stroke-width="1"/><text x="267.6" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c" letter-spacing=".4">SIM</text>
<rect x="380" y="431" width="230" height="78" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/><text x="495" y="457" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Teacher step</text><text x="495" y="477" text-anchor="middle" font-size="12" fill="#6b7280">open · pick · place · close</text><text x="495" y="493" text-anchor="middle" font-size="12" fill="#6b7280">free segments planned by rocRobo</text><rect x="573.2" y="422" width="28.799999999999997" height="18" rx="9" fill="#fff" stroke="#ea580c" stroke-width="1"/><text x="587.6" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c" letter-spacing=".4">SIM</text>
<rect x="700" y="431" width="230" height="78" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/><text x="815" y="457" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Judge the step</text><text x="815" y="477" text-anchor="middle" font-size="12" fill="#6b7280">grasped · on / inside ·</text><text x="815" y="493" text-anchor="middle" font-size="12" fill="#6b7280">joint opened / closed</text><rect x="893.2" y="422" width="28.799999999999997" height="18" rx="9" fill="#fff" stroke="#ea580c" stroke-width="1"/><text x="907.6" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c" letter-spacing=".4">SIM</text>
<rect x="1020" y="431" width="230" height="78" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/><text x="1135" y="457" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Task success tree</text><text x="1135" y="477" text-anchor="middle" font-size="12" fill="#6b7280">same predicates as the steps; a fail</text><text x="1135" y="493" text-anchor="middle" font-size="12" fill="#6b7280">names its first step and leaves</text><rect x="1213.2" y="422" width="28.799999999999997" height="18" rx="9" fill="#fff" stroke="#ea580c" stroke-width="1"/><text x="1227.6" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c" letter-spacing=".4">SIM</text>
<rect x="700" y="556" width="230" height="78" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/><text x="815" y="582" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">Repair loop</text><text x="815" y="602" text-anchor="middle" font-size="12" fill="#6b7280">agent proposes a grasp fix → sim</text><text x="815" y="618" text-anchor="middle" font-size="12" fill="#6b7280">re-trials → written back to the asset</text><rect x="840.4" y="547" width="81.6" height="18" rx="9" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="881.2" y="560" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing=".4">AGENT · SIM</text>
<rect x="1020" y="560" width="230" height="54" rx="27" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/><text x="1135" y="584" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2937">LeRobot dataset</text><text x="1135" y="604" text-anchor="middle" font-size="12" fill="#6b7280">+ videos + run summary</text>
