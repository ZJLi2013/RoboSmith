<rect x="760" y="681" width="74" height="18" rx="9" fill="#fff" stroke="#64748b" stroke-width="1"/><text x="797" y="694" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">AGENT / SIM</text>
<text x="78" y="694.5" font-size="12.5" fill="#4b5563">flow</text>
<text x="228" y="694.5" font-size="12.5" fill="#4b5563">next step</text>
<text x="378" y="694.5" font-size="12.5" fill="#4b5563">agent feedback loop</text>
<text x="582" y="694.5" font-size="12.5" fill="#4b5563">human</text>
<text x="692" y="694.5" font-size="12.5" fill="#4b5563">output</text>
<text x="842" y="694.5" font-size="12.5" fill="#4b5563">who acts / who judges</text>
