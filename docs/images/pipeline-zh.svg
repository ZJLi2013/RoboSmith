<text x="40" y="48" font-size="23" font-weight="700" fill="#111827">RoboSmith：从一句话到经过验证的 episode</text>
<text x="40" y="72" font-size="13.5" fill="#6b7280">agent 写场景、修抓取；仿真用同一组谓词判每件资产、每一步和整个任务。Genesis + Franka，运行在 AMD ROCm 上。</text>
